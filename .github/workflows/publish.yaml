# Publishes the multi-arch (linux/amd64 + linux/arm64) frontend image to GHCR.
#
# Layout: Docker's "distribute build across multiple runners" pattern. Each
# architecture is built on a native runner (no QEMU emulation) and pushed to
# GHCR by digest only (untagged). The `merge` job then stitches the per-arch
# digests into one manifest list and tags it `latest` and `<version>`.
#
# arm64 failure is non-blocking: production servers are amd64, so a failed
# arm64 build must never hold back a release. `merge` runs even if the arm64
# build failed and publishes amd64 only (with a warning). A missing amd64
# digest is a hard failure.
#
# ponytail: arm64 is best-effort. If arm64 becomes a supported deployment
# target, make its failure blocking (require both digests in `merge`).
#
# Dry run: `workflow_dispatch` exercises the pipeline from any branch without
# a release. It skips tag validation, uses version `dryrun-<sha7>`, builds
# both arches (untagged by-digest pushes), and runs `imagetools create
# --dry-run`, so nothing is tagged. Inspect and Discord are skipped. Dry runs
# do leave untagged per-arch versions in GHCR (the manifest-list step needs
# real pushed digests to be proven); prune them from the package settings if
# needed.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

# One group per release tag (per run id for dry runs), never cancelling. This
# guarantees a release run is never cancelled by another release or by a dry
# run, and that dry runs never block releases. It does NOT serialise releases:
# `merge` therefore only moves `latest` when its version is the highest released
# semver.
concurrency:
  group: publish-${{ github.event.release.tag_name || format('dryrun-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # Belt-and-suspenders: version consistency (tag == package.json == CHANGELOG) is already
      # enforced by release.yaml before the release is created. This guards manual `make release`
      # fallbacks too, where no such check runs.
      - name: Validate tag format
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG_NAME' must be vX.Y.Z (semantic versioning, e.g. v1.0.0)"
            exit 1
          fi
          echo "✅ Tag format is valid: $TAG_NAME"

      # Frontend image tags keep the `v` prefix (ghcr.io/letsrevel/revel-frontend:v2.34.1).
      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="$TAG_NAME"
          else
            VERSION="dryrun-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

  build:
    needs: validate
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # A hung leg must not hold `merge` (and the amd64 release) for the 6h default.
    timeout-minutes: 60
    # arm64 is best-effort: its failure must not mark the release run as failed.
    continue-on-error: ${{ matrix.platform == 'linux/arm64' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Compute platform pair
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      # One image for all deployments. PUBLIC_API_URL and ORIGIN are set at
      # RUNTIME (#396), so they are not build args; demo/prod differ only by the
      # runtime env in their respective compose files. PUBLIC_VERSION (shown in
      # the footer) is known only at release time, so it is passed as a build arg
      # and baked into the image's runtime ENV — read at runtime via
      # $env/dynamic/public (#493), not inlined into the JS bundle.
      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.pair }}
          # Supply-chain attestations published alongside the image to GHCR.
          sbom: true
          provenance: mode=max
          build-args: |
            PUBLIC_VERSION=${{ needs.validate.outputs.version }}
          outputs: type=image,name=ghcr.io/letsrevel/revel-frontend,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_DIR: ${{ runner.temp }}/digests
          PAIR: ${{ steps.platform.outputs.pair }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "::error::build produced no digest"
            exit 1
          fi
          # One file per platform, named after it, holding the bare digest, so
          # `merge` can download every artifact at once and still tell them apart.
          mkdir -p "$DIGEST_DIR"
          echo "${DIGEST#sha256:}" > "$DIGEST_DIR/$PAIR"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          # Re-run attempts re-upload the same artifact name.
          overwrite: true
          # Long enough for "Re-run failed jobs" days later to still find the
          # digest of the leg that succeeded.
          retention-days: 7

  merge:
    needs: [validate, build]
    name: Publish manifest list
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      # No continue-on-error: a genuine download failure must fail loudly rather
      # than masquerade as a missing (failed) arm64 build.
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Collect digests
        id: digests
        env:
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          # Absent file = that leg produced no artifact. Present but empty or
          # unreadable = corrupt: error out rather than treat it as absent.
          read_digest() {
            local f="$DIGEST_DIR/$1" d
            [ -e "$f" ] || return 0
            d=$(cat "$f") || { echo "::error::cannot read $f" >&2; return 1; }
            if [ -z "$d" ]; then
              echo "::error::digest file $f is empty" >&2
              return 1
            fi
            echo "$d"
          }
          AMD64=$(read_digest linux-amd64)
          ARM64=$(read_digest linux-arm64)

          if [ -z "$AMD64" ]; then
            echo "::error::amd64 digest is missing; refusing to publish. The amd64 build must succeed."
            exit 1
          fi
          echo "amd64=$AMD64" >> "$GITHUB_OUTPUT"

          if [ -z "$ARM64" ]; then
            echo "::warning::arm64 digest is missing (arm64 build failed); publishing amd64 only."
            echo "arm64_missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "arm64=$ARM64" >> "$GITHUB_OUTPUT"
            echo "arm64_missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Create manifest list
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          AMD64: ${{ steps.digests.outputs.amd64 }}
          ARM64: ${{ steps.digests.outputs.arm64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE=ghcr.io/letsrevel/revel-frontend
          args=(-t "$IMAGE:$VERSION"
                --annotation "index:org.opencontainers.image.source=https://github.com/letsrevel/revel-frontend")
          if [ "$EVENT_NAME" != "release" ]; then
            # Dry run: show what would happen, including `latest`.
            args+=(-t "$IMAGE:latest" --dry-run)
          else
            # Releases can run concurrently or be re-run for an older tag, so
            # only move `latest` when this is the highest released semver.
            HIGHEST=$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --exclude-drafts --exclude-pre-releases \
              --json tagName -q '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [ "$HIGHEST" = "$VERSION" ]; then
              args+=(-t "$IMAGE:latest")
            else
              echo "::notice::$VERSION is not the highest release ($HIGHEST); not moving latest."
              echo "- \`latest\` not moved ($VERSION is older than $HIGHEST)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          sources=("$IMAGE@sha256:$AMD64")
          if [ -n "$ARM64" ]; then
            sources+=("$IMAGE@sha256:$ARM64")
          fi
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      - name: Inspect image
        if: github.event_name == 'release'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: docker buildx imagetools inspect "ghcr.io/letsrevel/revel-frontend:$VERSION"

      - name: Summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          ARM64_MISSING: ${{ steps.digests.outputs.arm64_missing }}
        run: |
          {
            if [ "$EVENT_NAME" = "release" ]; then
              echo "### Published \`ghcr.io/letsrevel/revel-frontend:$VERSION\`"
            else
              echo "### Dry run for \`$VERSION\` (nothing tagged)"
            fi
            echo ""
            echo "- linux/amd64"
            if [ "$ARM64_MISSING" = "true" ]; then
              echo "- linux/arm64: **missing** (arm64 build failed)"
            else
              echo "- linux/arm64"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Ops signal: fires only after the image is pullable from GHCR. Failure
      # (Discord down, missing secret) must never fail the publish.
      - name: Notify Discord
        if: github.event_name == 'release'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_FRONTEND_WEBHOOK_URL }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          ARM64_MISSING: ${{ steps.digests.outputs.arm64_missing }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_FRONTEND_WEBHOOK_URL not set, skipping notification"
            exit 0
          fi
          SUFFIX=""
          if [ "$ARM64_MISSING" = "true" ]; then
            SUFFIX=" (amd64 only — arm64 build failed)"
          fi
          # Build the JSON with jq so the interpolated values are escaped, not
          # spliced into the shell/JSON as GitHub Actions expressions.
          payload=$(jq -n --arg v "$VERSION" --arg url "$RELEASE_URL" --arg s "$SUFFIX" \
            '{content: "📦 `ghcr.io/letsrevel/revel-frontend:\($v)` is published and ready to deploy — \($url)\($s)"}')
          curl -sf --max-time 10 -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload"
